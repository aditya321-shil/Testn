<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OneSignal Push + Math Test</title>

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "0276e733-a4c3-4c91-abc8-07493d1c56c8",
        safari_web_id: "web.onesignal.auto.145f18a4-510a-4781-b676-50fa3f7fa700",

        notifyButton: {
          enable: true,
        }
      });

      console.log("OneSignal Initialized!");
    });
  </script>
</head>

<body style="font-family:Arial; padding:30px;">

  <h1>OneSignal Notification + Math Test</h1>

  <button id="enablePush">Enable Push Notification</button>

  <hr>

  <h2>Simple Math Question</h2>
  <p id="question"></p>

  <input type="number" id="answer" placeholder="Enter answer">
  <button id="submit">Submit</button>

  <p id="msg"></p>

  <script>
    // Create simple math question
    const n1 = Math.floor(Math.random()*10)+1;
    const n2 = Math.floor(Math.random()*10)+1;

    document.getElementById("question").innerText =
      `What is ${n1} + ${n2}?`;

    const correct = n1 + n2;

    // Request Notification Permission
    document.getElementById("enablePush").onclick = async function () {
      if (window.OneSignal) {
        await OneSignal.Notifications.requestPermission();
        alert("Permission requested!");
      }
    };

    // Local browser notification
    function localNotify(title, body) {
      if (Notification.permission === "granted") {
        new Notification(title, { body });
      } else {
        Notification.requestPermission().then(p => {
          if (p === "granted") new Notification(title, { body });
        });
      }
    }

    // Check answer
    document.getElementById("submit").onclick = function () {
      const ans = Number(document.getElementById("answer").value);
      const msg = document.getElementById("msg");

      if (ans === correct) {
        msg.innerText = "Correct! 🎉";
        msg.style.color = "green";

        // Show immediate local notification
        localNotify("Correct!", "You solved the math question!");
      } else {
        msg.innerText = "Wrong answer. Try again!";
        msg.style.color = "red";
      }
    };
  </script>

</body>
</html>
